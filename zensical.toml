[project]
site_name = "start-ocr"
site_description = "Applying pdfplumber + opencv + pytesseract to extract content and metadata from formal PDF files."
site_author = "Marcelino Veloso III"
copyright = "Copyright &copy; Marcelino Veloso III"

nav = [
  { "Overview" = "index.md" },
  { "Setup" = "setup.md" },
  { "Measurements" = "measurements.md" },
  { "Slicing" = "slice.md" },
  { "Coordinates" = "coordinates.md" },
  { "Components" = "components.md" },
  { "Content" = "content.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
