[project]
name = "start-ocr"
version = "0.1.0"
authors = [{name="Marcelino Veloso III", email="hi@mv3.dev" }]
description = "Applying pdfplumber + opencv + pytesseract to extract content and metadata from formal PDF files."
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
  "pdfplumber >= 0.11",
  "opencv-python >= 4.11",
  "pytesseract >= 0.3.13",
]

[dependency-groups]
dev = [
  # docs
  "zensical>=0.0.45",
  "mkdocstrings-python>=2.0.3",
  # testing
  "pytest>=9.0",
  "pytest-cov>=7.0",
  # notebooks
  "ipykernel>=6.29",
  # publishing
  "build>=1.2",
  "twine>=6.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q -vv --cov --doctest-modules"
pythonpath = ["src"]
testpaths = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["F401", "F403", "E501"]
fixable = ["F", "E", "W", "I001"]
select = ["E", "F", "W", "I", "C"]
